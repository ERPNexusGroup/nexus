[project]
name = "test-erp-project"
version = "0.1.0"
description = "ERP Nexus deployment — test-erp-project"
requires-python = ">=3.11"
dependencies = [
    "erp-nexus>=0.2.0",
    "django>=5.0,<5.1",
    "django-ninja>=1.0.0",
    "django-jazzmin>=3.0.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "semantic-version>=2.10.0",
]

[project.optional-dependencies]
production = [
    "gunicorn>=22.0.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "erp_nexus.settings.development"
pythonpath = ["."]
